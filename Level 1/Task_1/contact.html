<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevCraft | Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container navbar">
      <div class="logo">DevCraft</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h2>Contact Us</h2>
    <form class="contact-form" action="#" method="post" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your Full Name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="your.email@example.com" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
      </div>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 DevCraft. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
